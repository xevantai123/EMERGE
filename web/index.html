<!DOCTYPE html>
<html>
<head>
    
    <title>New Sign Up</title>
    <style>
        body {
            margin:0;
            padding-top: 150px;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            text-align:center;
            background-image: url("2025-04-26_22h26_14.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            }
            .container {
    background: rgb(129, 46, 46);
    padding: 25px;
    border: 1px solid #ccc;
    border-radius: 12px;
}
button {
    width: 140px;
    padding: 8px 14px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 20px;
    }
.button-group {
    display: flex;
    gap: 10px;
    
}
label{
    font-weight:bold;
}
select{
    width:100%;
    padding:8px;
    margin-top:8px;
    margin-bottom:20px;
}
.environment-group {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 10px;
    margin-bottom: 15px;
}

.environment-group label {
    font-weight: normal;
}

.environment-group input {
    width: auto;
    margin-right: 5px;
}
    </style>
</head>
<body>

    <div class="container">

<h2>New Sign Up</h2>

<label>User:</label>

<select id="envSelect">
    <option value="Henry">Henry</option>
    <option value="Jack">Jack</option>
    <option value="Gigi">Gigi</option>
</select>
<label>Environment:</label>

<div class="environment-group">
    <label>
        <input type="radio" name="environment" value="staging" checked>
        Staging
    </label>

    <label>
        <input type="radio" name="environment" value="live">
        Live
    </label>
</div>


<div id="result"></div>



<div class="button-group">

    <button onclick="generate()">Generate</button>

    <button onclick="copyUrl()">📋 Copy URL</button>

</div>

<div class="button-group">

    <button onclick="openTenant()">🌐 Open Tenant</button>

    <button onclick="autoLogin()">🔐 Auto Login</button>

</div>

</div>

<p id="result"></p>

<script src="app.js"></script>

</body>
</html>
